services:
  - type: web
    name: validador-financiero-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/main.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
